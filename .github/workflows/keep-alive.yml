name: Keep Streamlit App Awake

on:
  schedule:
    # Se ejecuta cada 10 horas para no superar el límite de 12h
    - cron: '17 */10 * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente para probar

jobs:
  wake-up:
    runs-on: ubuntu-latest
    steps:
      - name: Wake up Streamlit App
        run: |
          echo "Despertando la app..."
          pip install streamlit-wakeup
          streamlit-wakeup https://agentempleo.streamlit.app
